name: Windows desktop

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/windows-desktop.yml"

permissions:
  contents: read

env:
  POPPLER_VERSION: "24.08.0-0"

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - name: Determine version
        id: version
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME.TrimStart("v") } else { "0.0.0-dev.$env:GITHUB_RUN_NUMBER" }
          "value=$version" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            desktop/requirements.txt
      - name: Install Python dependencies
        run: pip install -r backend/requirements.txt -r desktop/requirements.txt

      - name: Download Poppler for Windows
        working-directory: desktop
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          $url = "https://github.com/oschwartz10612/poppler-windows/releases/download/v$env:POPPLER_VERSION/Release-$env:POPPLER_VERSION.zip"
          Invoke-WebRequest $url -OutFile build/poppler.zip
          Expand-Archive build/poppler.zip -DestinationPath build/poppler-extract
          $root = Get-ChildItem build/poppler-extract -Directory | Select-Object -First 1
          Move-Item $root.FullName build/poppler
          if (-not (Test-Path build/poppler/Library/bin/pdftoppm.exe)) { throw "Poppler 壓縮檔缺少 pdftoppm.exe" }

      - name: Build executable
        working-directory: desktop
        run: pyinstaller --noconfirm pdf_editor.spec

      - name: Self test
        working-directory: desktop
        run: |
          $process = Start-Process "dist/PDF Editor/PDF Editor.exe" -ArgumentList "--self-test" -PassThru -Wait
          Get-Content "$env:LOCALAPPDATA/PDF Editor/logs/pdf-editor.log" -ErrorAction SilentlyContinue
          if ($process.ExitCode -ne 0) { throw "自我測試失敗（exit code $($process.ExitCode)）" }

      - name: Package portable zip
        working-directory: desktop
        run: |
          New-Item -ItemType Directory -Force portable | Out-Null
          Copy-Item "dist/PDF Editor" "portable/PDF Editor" -Recurse
          "此檔案存在時，程式資料會存放在旁邊的 data 資料夾。刪除後改用 %LOCALAPPDATA%\PDF Editor。" |
            Out-File "portable/PDF Editor/portable.txt" -Encoding utf8
          Compress-Archive "portable/PDF Editor" "dist/PDF-Editor-Portable-${{ steps.version.outputs.value }}.zip"

      - name: Build installer
        working-directory: desktop
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6"
            if (-not (Test-Path "$iscc\ISCC.exe")) { choco install innosetup -y --no-progress }
            $env:PATH += ";$iscc"
          }
          try {
            Invoke-WebRequest "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/Unofficial/ChineseTraditional.isl" -OutFile build/ChineseTraditional.isl
          } catch {
            Write-Warning "無法下載繁體中文安裝介面，安裝程式只提供英文"
          }
          iscc "/DAppVersion=${{ steps.version.outputs.value }}" installer.iss

      - uses: actions/upload-artifact@v4
        with:
          name: pdf-editor-windows-${{ steps.version.outputs.value }}
          path: |
            desktop/dist/*.zip
            desktop/dist/*.exe

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
