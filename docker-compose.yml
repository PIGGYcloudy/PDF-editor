services:
  # 後端服務
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:7999"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/outputs:/app/outputs
    environment:
      - PYTHONUNBUFFERED=1
      - FILE_RETENTION_HOURS=24
      - CLEANUP_INTERVAL_MINUTES=30
    networks:
      - pdf-editor-network
    restart: unless-stopped

  # 前端服務
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8081:80"
    depends_on:
      - backend
    networks:
      - pdf-editor-network
    restart: unless-stopped

networks:
  pdf-editor-network:
    driver: bridge
